[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sunfish"
version = "2026"
description = "Sunfish: a minimalist chess engine written in Python"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.7"
# The engine itself has no dependencies.
dependencies = []

[project.urls]
Homepage = "https://github.com/thomasahle/sunfish"

[project.scripts]
sunfish = "sunfish:main"

[project.optional-dependencies]
# For the tools/ scripts (terminal play, testing) in a repo checkout.
tools = [
    "chess==1.9.4",
    "tqdm==4.67.1",
]

[dependency-groups]
dev = [
    "chess==1.9.4",
    "tqdm==4.67.1",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "flake8",
]

[tool.setuptools]
# The engine, plus the UCI interface it drives -- sunfish.py imports it
# unconditionally, so it has to be installed alongside. `tools/` is not
# shipped: those are development scripts, and `tools` is far too generic
# a name for a distribution to claim in site-packages.
py-modules = ["sunfish"]
packages = ["sunfish_tools"]

