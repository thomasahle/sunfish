[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sunfish"
version = "2026.1"
description = "Sunfish: a minimalist chess engine written in Python"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.10"
# The engine module itself has no dependencies; the default `sunfish`
# entry point is the play interface, which needs python-chess.
dependencies = [
    "chess==1.9.4",
]

[project.urls]
Homepage = "https://github.com/thomasahle/sunfish"

[project.scripts]
sunfish = "sunfish_ui.fancy:run"
sunfish-uci = "sunfish:main"

[dependency-groups]
# chess: mock server + regression tests; tqdm: tools/tester.py progress
# bars; flake8: the CI lint job. No async tests exist - pytest-asyncio
# was never consumed.
dev = [
    "chess==1.9.4",
    "tqdm==4.67.1",
    "pytest>=7.0.0",
    "flake8",
]

[tool.setuptools]
# The engine, plus the UCI interface it drives -- sunfish.py imports it
# unconditionally, so it has to be installed alongside. `tools/` is not
# shipped: those are development scripts, and `tools` is far too generic
# a name for a distribution to claim in site-packages.
py-modules = ["sunfish"]
packages = ["sunfish_ui"]

