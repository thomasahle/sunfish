# lichess-bot configuration for sunfish.
# Copied to /opt/lichess-bot/config.yml by setup.sh, which fills in the token.
token: "YOUR_TOKEN_HERE"
url: "https://lichess.org/"

engine:
  dir: "/opt/sunfish"
  name: "sunfish.py"
  working_dir: "/opt/sunfish"
  protocol: "uci"
  ponder: true
  uci_options:
    # ~100MB of transposition tables: sized for a 1GB free-tier VM.
    # Raise to 1000000 (~1GB) on a machine with 4GB+.
    TABLE_SIZE: 100000

challenge:
  concurrency: 1
  # Humans only: bot-vs-bot games mostly farm rating off sunfish and burn
  # the VM's CPU without anyone watching.
  accept_bot: false
  variants:
    - standard
  time_controls:
    - bullet
    - blitz
    - rapid
  modes:
    - casual
    - rated

greeting:
  # Sent in chat when a game starts; also reassures opponents that the
  # long first-move think (~10s) is thinking, not stalling.
  hello: "Hi {opponent}! I'm {me}, a tiny open-source Python engine. My first move can take ~10s - just thinking, not stalling. Good luck!"
  goodbye: "Good game! Play me again any time, or read my source at github.com/thomasahle/sunfish"
  hello_spectators: "Hi! I'm {me}, a tiny open-source Python chess engine (github.com/thomasahle/sunfish)"
  goodbye_spectators: "Thanks for watching!"

matchmaking:
  allow_matchmaking: false
