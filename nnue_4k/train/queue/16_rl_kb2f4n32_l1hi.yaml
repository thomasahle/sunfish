# COHORT 1 of the NNUE RELAUNCH PORTFOLIO.  Registered in
# nnue_4k/MEASUREMENTS.md ("PORTFOLIO REGISTRATION", 2026-08-19, commit
# db70dfb) BEFORE this file was written, with the byte price, the speed price
# and the screen bars all committed first.
#
# EVERY arm in this cohort is one variable against run 360
# (factor_r8n32m_final, val 0.0151800), whose recipe -- lr 1.2e-2, 6 epochs,
# linear, seed 0, l1 5e-4, satpen 0.03, sigK 400, lam 1.0, mirror on -- is
# reproduced here field for field.  That is the only reason the cells are
# comparable at all.
#
# VAL PROMOTES NOTHING.  Five statistics have predicted play confidently in
# this family and five have been contradicted.  Val here is used for exactly
# two things: the do-nothing floor (an arm above the `mat` anchor is broken),
# and the run report.  The promoter is the 540-game round robin registered in
# the memo, and its bars (CONTINUE 40.0%, WIN ~59%, STOP inside 22-36%) were
# fixed before any arm existed.
#
# BIAS-RAIL CHECK IS MANDATORY on every export in this portfolio: report the
# count of lane gains pinned at digit 89, the count of bias digits pinned at
# -44/+45, and sum_k G_k against 65,534.  A clipping run is REPORTED, never
# silently rescaled -- `biasscale` is trainer-only and an S>1 net must never
# be spliced into an entry.

#
# WHY THIS ARM
#
# ADDED 2026-08-19 AFTER THE EMITTER MEASURED THE BUCKET PRICE, and it exists
# because that measurement moved a bar rather than confirmed one.  The
# registration composed the bucket machinery at ~35 B.  Built and packed, it
# is 150 B for kb and 185 B for pb -- 4-5x the estimate.  So 12_rl_kb2f4n32
# at l1=5e-4 packs to 4,095 B at the 43% U zeros trained nets actually reach,
# which is 1 B under the hard limit and 29 B OVER the 30 B margin: it is a
# val cell, not a shippable arm.
#
# The sparsity sweep through pack.sh says exactly what is needed: kb2 fits at
# >= ~62% U zeros (4,033 B at 65%, 3,997 at 70%).  This arm is 12 with the l1
# that has a chance of getting there, so the cohort carries a king-bucket arm
# that can actually be built into a checkout and play a game.
#
# PRICE, STATED BEFORE THE RUN (the artifact number is pack.sh's alone)
#
# 961 digits.  MEASURED through nnue-4k's pack.sh on a built, running proto:
# 4,095 B at 43% U zeros / 4,070 at 55% / 4,033 at 65% / 3,997 at 70% /
# 3,954 at 75%.  BYTE-CONDITIONAL at <= 4,066 B, so this arm ships only if it
# trains to >= ~62% U zeros; if l1=2e-3 undershoots, the next lever is
# rate_penalty (rate/rate_T), which targets a zero fraction directly instead
# of leaning on l1 to produce one.
#
name: rl_kb2f4n32_l1hi
data:
  source: pool10m.npz
  kind: lambda-npz
  cpmax: 1000
  split: fenkey
  split_seed: 20260813
  val_mod: 20
  limit: 0
  workers: 8
model:
  arch: factor
  N: 32
  base: mat
  ternary: 0.85
  factor: 0
  gridste: 1
  lr_rank: 4
  lr_mirror: 1
  lr_vmax: 44
  kb: 2
  pb: 1
  clampcp: 600
loss:
  l1: 0.002
  lam: 1.0
  losspow: 2.0
  rate: 0.0
  satpen: 0.03
  satthresh: 480.0
  sigK: 400.0
opt:
  epochs: 6
  batch: 8192
  lr: 0.012
  sched: linear
  seed: 0
  threads: 8
  wclip: 1.0
  weight_decay: 1.0e-05
out_dir: runs/rl_kb2f4n32_l1hi
notes: the BUILDABLE king-bucket arm -- kb2 at l1=2e-3, added after pack.sh measured that the l1=5e-4 version cannot fit (4095 B at 43% U zeros, and the bucket machinery is 150 B, not the ~35 B the registration composed)
