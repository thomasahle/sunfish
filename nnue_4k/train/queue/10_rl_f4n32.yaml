# COHORT 1 of the NNUE RELAUNCH PORTFOLIO.  Registered in
# nnue_4k/MEASUREMENTS.md ("PORTFOLIO REGISTRATION", 2026-08-19, commit
# db70dfb) BEFORE this file was written, with the byte price, the speed price
# and the screen bars all committed first.
#
# EVERY arm in this cohort is one variable against run 360
# (factor_r8n32m_final, val 0.0151800), whose recipe -- lr 1.2e-2, 6 epochs,
# linear, seed 0, l1 5e-4, satpen 0.03, sigK 400, lam 1.0, mirror on -- is
# reproduced here field for field.  That is the only reason the cells are
# comparable at all.
#
# VAL PROMOTES NOTHING.  Five statistics have predicted play confidently in
# this family and five have been contradicted.  Val here is used for exactly
# two things: the do-nothing floor (an arm above the `mat` anchor is broken),
# and the run report.  The promoter is the 540-game round robin registered in
# the memo, and its bars (CONTINUE 40.0%, WIN ~59%, STOP inside 22-36%) were
# fixed before any arm existed.
#
# BIAS-RAIL CHECK IS MANDATORY on every export in this portfolio: report the
# count of lane gains pinned at digit 89, the count of bias digits pinned at
# -44/+45, and sum_k G_k against 65,534.  A clipping run is REPORTED, never
# silently rescaled -- `biasscale` is trainer-only and an S>1 net must never
# be spliced into an entry.

#
# WHY THIS ARM
#
# THE CARRIER CONTROL, and it has never been trained.  The factored lane built
# and RAN mirrored r=4/N=32 at 3,677 B (419 spare) but only ever TRAINED r=8/N=32
# (4,053 B, 43 spare, val 0.0151800, screened at 32.00%).  Every bucketed arm in
# this cohort is r=4 with B=2, so r=4/B=1 is the cell they must be read against.
# Without it the cohort would be comparing bucketed r=4 nets to an unbucketed
# r=8 net and calling the difference "buckets".
#
# PRICE, STATED BEFORE THE RUN (the artifact number is pack.sh's alone)
#
# digits = 384*1 + 4*32 + 65 = 577.  Predicted 3,701 B against the BUILT 3,677 B
# -- the calibration point for every other prediction in this cohort.
# Speed: N=32, -52.6% nps, -67.3 Elo timed (measured on a built artifact).
name: rl_f4n32
data:
  source: pool10m.npz
  kind: lambda-npz
  cpmax: 1000
  split: fenkey
  split_seed: 20260813
  val_mod: 20
  limit: 0
  workers: 8
model:
  arch: factor
  N: 32
  base: mat
  ternary: 0.85
  factor: 0
  gridste: 1
  lr_rank: 4
  lr_mirror: 1
  lr_vmax: 44
  kb: 1
  pb: 1
  clampcp: 600
loss:
  l1: 0.0005
  lam: 1.0
  losspow: 2.0
  rate: 0.0
  satpen: 0.03
  satthresh: 480.0
  sigK: 400.0
opt:
  epochs: 6
  batch: 8192
  lr: 0.012
  sched: linear
  seed: 0
  threads: 8
  wclip: 1.0
  weight_decay: 1.0e-05
out_dir: runs/rl_f4n32
notes: carrier control: mirrored r=4 N=32 B=1, the untrained half of the factored lane's own byte table; the cell every bucketed arm is read against
