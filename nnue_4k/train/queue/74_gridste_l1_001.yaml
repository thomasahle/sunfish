# gridste-l1-001 -- the DENSITY DIAL re-asked under the exported-fidelity
# rule (registered line 1, c1024-cal).
#
# The float family answered this once: l1 .0005 beat .001 (0.01280 vs
# 0.01286) and the ledger recorded "density pays under products".  That
# answer was obtained by a net trained at a precision its artifact does not
# have, and the same recipe lost 0.00067 of its val when forced onto the real
# grid (0.01280 -> 0.01347).  A dial tuned against a fiction has to be
# re-read against the artifact.  One field from run 70.
#
# PRE-REGISTERED READING: run 70's 0.01347 is the reference.  If .001 now
# wins, the float-era "density pays" line is an artifact of the free-float
# read-out and the ledger says so; if .0005 still wins, the dial survives
# contact with the grid and 70 stays the family's best.
name: gridste_l1_001
data: {source: ../cache_repl8M.pkl, kind: legacy-pkl, split: legacy-perm, valn: 4027406}
model: {arch: ml2, N: 4, base: mat, ternary: 0.85, bm: 4, u2grid: 1, gridste: 1}
loss: {l1: 0.001, satpen: 0.03, satthresh: 480.0}
opt: {epochs: 30, batch: 8192, lr: 3.0e-3, seed: 0}
notes: "density dial under full exported fidelity: l1 .001 vs run 70's .0005
  (0.01347); re-reads the float era's 'density pays' against the real grid"
