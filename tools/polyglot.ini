; WinBoard/XBoard <-> UCI adapter config for sunfish.
; Run from the REPO ROOT:   xboard -fcp 'polyglot tools/polyglot.ini'
; (PolyGlot 2.0.4 resolves EngineDir against the invoking directory, so
; the working directory matters; "EngineDirectory" is silently ignored.)
; ./sunfish.py (not "python3 sunfish.py") lets the polyglot header pick
; pypy3 when available - several times faster than CPython.

[PolyGlot]
EngineName = Sunfish
EngineDir = .
EngineCommand = ./sunfish.py
; For debugging, add:
; Log = true
; LogFile = polyglot.log

[Engine]
; Entries here are sent to the engine as UCI options. The defaults:
; TABLE_SIZE = 1000000
; QS = 40
; QS_A = 140
; EVAL_ROUGHNESS = 15
