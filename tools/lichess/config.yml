# lichess-bot configuration for sunfish.
# Copied to /opt/lichess-bot/config.yml by setup.sh, which fills in the token.
token: "YOUR_TOKEN_HERE"
url: "https://lichess.org/"

engine:
  dir: "/opt/sunfish"
  name: "sunfish.py"
  working_dir: "/opt/sunfish"
  protocol: "uci"
  ponder: true
  # Run the engine 10 niceness levels below lichess-bot. The bot's event loop
  # has to stay responsive enough to read the opponent's move off the socket
  # while the engine ponders; at equal priority a deep ponder search can
  # starve it (observed: a 23-second stall that flagged an otherwise won
  # game). `nice` execs sunfish.py, whose polyglot header then execs pypy3,
  # so the niceness is inherited and the pypy3/python3 fallback still works.
  interpreter: "nice"
  interpreter_options:
    - "-n"
    - "10"
  uci_options:
    # Sized from measurement, not guesswork. Under pypy3 each transposition
    # entry costs ~0.8 kB resident, and TABLE_SIZE bounds tp_score and
    # tp_move independently, so the tables can reach 2 * TABLE_SIZE entries:
    #   TABLE_SIZE=1000000 -> ~2M entries -> ~1.6 GB tables + ~36 MB pypy3
    #                         baseline = ~1.7 GB peak RSS.
    # Sized for the Oracle A1 box (measured shape: 2 OCPUs / 12 GB), shared
    # with the nnue bot, whose tables peak at 5-6 GB at its own 10^6 (its
    # entries carry accumulator big ints, ~2-3 kB each -- see
    # nnue_4k/lichess/config.yml). Worst case: ~1.7 GB (classic) + ~6 GB
    # (nnue) + ~1 GB (OS, bots' pools) ~= 9 GB of 12 GB. An engine that
    # swaps mid-search is slow in a way no scheduling fix repairs -- the old
    # 1 GB GCP box was found at TABLE_SIZE=300000 (~516 MB peak RSS), paging
    # ~245 MB *while idle*. On a 1 GB box this must come DOWN to 50000
    # (~120 MB peak RSS).
    TABLE_SIZE: 1000000

challenge:
  concurrency: 1
  # Bot games welcome (Thomas 2026-08-11, both bots). The old humans-only
  # rationale (rating farming, CPU burn) belonged to the throttled 1 GB VM.
  accept_bot: true
  variants:
    - standard
  time_controls:
    - bullet
    - blitz
    - rapid
  modes:
    - casual
    - rated

greeting:
  hello: "Hi {opponent}! I'm sunfish, a tiny python chess engine by Thomas D. Ahle. Good luck and have fun!"
  goodbye: "Good game! Play me again any time, or read my source at github.com/thomasahle/sunfish"
  hello_spectators: "Hi! I'm {me}, a tiny open-source Python chess engine (github.com/thomasahle/sunfish)"
  goodbye_spectators: "Good game! Thanks for watching!"

matchmaking:
  allow_matchmaking: false
