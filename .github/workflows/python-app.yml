# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python application

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Pypy 3.9
      uses: actions/setup-python@v4
      with:
        python-version: 'pypy3.9'
        cache: 'pip' # caching pip dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test
      run: |
        bash tools/quick_tests.sh "python ./sunfish.py"
    - name: UCI smoke test (sunfish)
      run: |
        printf 'uci\nisready\nposition startpos moves e2e4\ngo movetime 500\nquit\n' \
          | python ./sunfish.py | tee /dev/stderr | grep -q bestmove
    - name: UCI smoke test (sunfish_nnue)
      # sunfish_nnue.py is currently broken on master (#117, #120); it is being
      # fixed on the nnue branch. Remove continue-on-error once that lands.
      continue-on-error: true
      run: |
        pip install "numpy<2"
        printf 'uci\nisready\nposition startpos moves e2e4\ngo movetime 500\nquit\n' \
          | python ./sunfish_nnue.py nnue/models/tanh.pickle | tee /dev/stderr | grep -q bestmove
    - name: Pytest suite
      run: |
        if [ -d tests ]; then python -m pytest tests -q; else echo "no tests/ directory on this branch"; fi
