name: Release

# Tag-driven releases: push a tag like v2026 to build, smoke-test, and
# publish - to PyPI via trusted publishing (OIDC, no tokens), and to a
# GitHub Release carrying the packed 4K build.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Build sdist and wheel
      run: |
        pip install build
        python -m build
    - name: Smoke-test the wheel end-to-end
      run: |
        pip install dist/*.whl
        # The default entry point is the play interface; the engine is sunfish-uci.
        sunfish --help >/dev/null 2>&1 || python -c "import sunfish_ui.fancy"
        printf 'uci\nisready\nposition startpos\ngo movetime 300\nquit\n' \
          | timeout 60 sunfish-uci | tee /dev/stderr | grep -q bestmove
        # The wheel must ship sunfish_ui/, i.e. the real UCI interface.
        # Run from an empty directory so only the installed copy can satisfy
        # the import, and use a Black-to-move FEN: a wheel that shipped
        # sunfish.py alone cannot start at all, and one that answered from
        # the untouched initial board would reply from rank 1 or 2 (#156).
        cd "$(mktemp -d)"
        printf 'uci\nisready\nposition fen rnbqkbnr/ppp1p1pp/8/3pPp2/8/8/PPPP1PPP/RNBQKBNR b KQkq - 1 4\ngo movetime 300\nquit\n' \
          | timeout 60 sunfish-uci | tee /dev/stderr | grep '^bestmove' > bm.txt
        grep -q '^bestmove' bm.txt
        ! grep -q '^bestmove [a-h][12]' bm.txt
    - name: Build the packed TCEC shell engines
      # Self-executing shell files for the TCEC 4k division: classic
      # under 4096 bytes (historically ~3.3KB), and - once nnue_4k/ is
      # merged - the NNUE engine under 4096. Budgets are asserted: an
      # artifact labeled 4k that exceeds 4096 bytes is a lie, and the
      # release should fail rather than ship it.
      run: |
        pip install python-minifier
        bash tools/build/pack.sh sunfish.py sunfish-classic-4k.sh
        CB=$(wc -c < sunfish-classic-4k.sh)
        echo "classic packed: $CB bytes"
        test "$CB" -le 4096
        if [ -f nnue_4k/sunfish_packed.py ]; then
          (cd nnue_4k && bash ../tools/build/pack.sh sunfish_packed.py ../sunfish-nnue-4k.sh)
          NB=$(wc -c < sunfish-nnue-4k.sh)
          echo "nnue packed: $NB bytes"
          test "$NB" -le 4096
        else
          echo "nnue_4k/ not present - classic artifact only"
        fi
    - uses: actions/upload-artifact@v4
      with:
        name: dist
        path: |
          dist/
          sunfish-*-4k.sh

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC for PyPI trusted publishing
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist
    - name: Create GitHub Release with artifacts
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" \
          --repo "$GITHUB_REPOSITORY" \
          --title "sunfish $GITHUB_REF_NAME" \
          --generate-notes \
          dist/*.tar.gz dist/*.whl sunfish-*-4k.sh
